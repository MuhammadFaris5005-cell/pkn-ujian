<title>Alat Rakaman Suara Guru</title>
<!-- Alat rakaman suara guru pembina: Pengembaraan Kata Nama. Fail berasingan; TIDAK menyentuh simulasi (index.html).

<style>
:root{--kayu:#7A4A22;--emas:#F2B705;--hijau:#2E7D32;--merah:#B3261E;--kelabu:#555}
*{box-sizing:border-box}
html,body{margin:0;background:#F4EBDD;color:#111;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:6px 0 4px}h2{font-size:1.15rem;margin:14px 0 6px}
p{margin:6px 0}.kecil{font-size:.9rem;color:#333}
.kad{background:#fff;border:3px solid var(--kayu);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 0 #C9A27A}
button{font:inherit;font-weight:700;border-radius:14px;border:3px solid var(--kayu);background:#fff;color:#111;min-height:52px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
button.utama{background:var(--emas);border-color:#9A7300}
button.rakam{background:var(--merah);border-color:#7A1A14;color:#fff}
button.hijau{background:var(--hijau);border-color:#1B5E20;color:#fff}
button.bahaya{background:#fff;border-color:var(--merah);color:var(--merah)}
.guru-btn{display:flex;width:100%;justify-content:space-between;align-items:center;margin:10px 0;min-height:68px;font-size:1.2rem;text-align:left}
.guru-btn small{font-weight:600;font-size:.95rem;color:#333}
.atas{display:flex;align-items:center;gap:8px}
.atas .nama{flex:1;font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.baris-kemajuan{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.baris-kemajuan .suis{margin:2px 0;min-height:40px}
main .kad{padding:12px}
.ayat.panjang{font-size:clamp(1.25rem,4.8vw,1.8rem)}
.ayat{margin:10px 0}
.atas button{min-height:46px;padding:6px 10px;font-size:.95rem}
.trek{height:12px;background:#E8D6B5;border-radius:8px;overflow:hidden;margin:6px 0 2px}.trek i{display:block;height:100%;background:var(--hijau)}
.suis{display:flex;align-items:center;gap:10px;font-weight:700;margin:8px 0;min-height:44px}
.suis input{width:26px;height:26px}
.meta{font-size:.95rem;color:#333}
.lencana{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.85rem;font-weight:800;border:2px solid #111;margin-right:4px}
.k1{background:#FFE08A}.k2{background:#D7ECFF}.k3{background:#EEE}
.ayat{font-size:clamp(1.45rem,5.6vw,2.05rem);font-weight:800;line-height:1.3;margin:12px 0;color:#000;overflow-wrap:anywhere}
.nada{background:#FFF8E1;border-left:6px solid var(--emas);padding:6px 10px;border-radius:8px;font-size:.98rem}
.fail{font-family:Consolas,Menlo,monospace;font-size:.98rem;background:#F1F1F1;border-radius:8px;padding:4px 8px;display:inline-block;word-break:break-all}
.status{font-weight:800;margin:10px 0;min-height:1.4em}.status.ok{color:var(--hijau)}.status.salah{color:var(--merah)}.status.rekod{color:var(--merah)}
.kawalan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.kawalan .penuh{grid-column:1/-1}
.navi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bawah{display:grid;gap:10px;margin-top:12px}
.senarai{list-style:none;margin:0;padding:0}
.senarai li button{display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;text-align:left;margin:6px 0;min-height:56px;font-weight:600}
.senarai li button b{font-size:1.1rem}.senarai li button small{display:block;font-family:Consolas,Menlo,monospace;font-size:.85rem;color:#333}
.siap{color:var(--hijau)}
.ralat{background:#fff;border:3px solid var(--merah);color:#7A0000;border-radius:12px;padding:10px 12px;font-weight:700}
.titik{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--merah);margin-right:6px;animation:kelip 1s infinite}
@keyframes kelip{50%{opacity:.2}}
input[type=text]{font:inherit;font-size:1.1rem;padding:10px;border:3px solid var(--kayu);border-radius:12px;width:100%}
@media (min-width:900px){main{padding-top:20px}}
</style>
</head>

// ---------- Storan (IndexedDB). Kunci = "GURU/nama-fail": data setiap guru terasing ----------
const DB={db:null,mem:new Map(),gagal:false,
  buka(){return new Promise(ok=>{try{const r=indexedDB.open("pkn-rakaman-guru",1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore("rakaman",{keyPath:"kunci"});s.createIndex("guru","guru")};
    r.onsuccess=()=>{this.db=r.result;ok(true)};r.onerror=()=>{this.gagal=true;ok(false)};r.onblocked=()=>{this.gagal=true;ok(false)}}catch(e){this.gagal=true;ok(false)}})},
  _op(mode,fn){return new Promise(ok=>{try{const tx=this.db.transaction("rakaman",mode),q=fn(tx.objectStore("rakaman"));tx.oncomplete=()=>ok(q&&"result"in q?q.result:true);tx.onerror=tx.onabort=()=>ok(null)}catch(e){ok(null)}})},
  async simpan(r){if(!this.db){this.mem.set(r.kunci,r);return true}return!!(await this._op("readwrite",s=>s.put(r)))},
  async senarai(guru){if(!this.db)return[...this.mem.values()].filter(r=>r.guru===guru);return(await this._op("readonly",s=>s.index("guru").getAll(guru)))||[]},
  async padamGuru(guru){const L=await this.senarai(guru);if(!this.db){L.forEach(r=>this.mem.delete(r.kunci));return L.length}
    await this._op("readwrite",s=>{L.forEach(r=>s.delete(r.kunci))});return L.length}
};

const apple=/Apple/.test(navigator.vendor||"")||/iPhone|iPad|iPod/.test(navigator.userAgent);
function pilihMime(){if(!window.MediaRecorder)return"";const s=t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}};
  const urut=apple?["audio/mp4","audio/aac","audio/webm;codecs=opus","audio/webm"]:["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];return urut.find(s)||""}
const extDari=m=>/mp4|aac|m4a/.test(m)?"m4a":/ogg/.test(m)?"ogg":/webm/.test(m)?"webm":"m4a";
const extJangka=()=>extDari(pilihMime()||(apple?"audio/mp4":"audio/webm"));

function semakSokongan(){
  if(!window.isSecureContext)return"Alat ini mesti dibuka melalui pautan https (GitHub Pages). Mikrofon tidak berfungsi jika fail dibuka terus daripada folder.";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return"Pelayar ini tidak menyokong rakaman suara. Gunakan Safari (iPhone) atau Chrome (Android/komputer) versi terkini.";
  return""}
function mesejRalatMikrofon(e){const n=e&&e.name||"";
  if(n==="NotAllowedError"||n==="SecurityError"||n==="PermissionDeniedError")return"Izin mikrofon ditolak. iPhone: buka Tetapan > Safari > Mikrofon > pilih Tanya atau Benarkan, kemudian muat semula halaman ini. Android (Chrome): ketik ikon di sebelah kiri alamat laman > Kebenaran > Mikrofon > Benarkan, kemudian muat semula.";
  if(n==="NotFoundError"||n==="DevicesNotFoundError")return"Mikrofon tidak ditemui. Pastikan peranti mempunyai mikrofon yang berfungsi.";
  if(n==="NotReadableError"||n==="TrackStartError")return"Mikrofon sedang digunakan oleh aplikasi lain (contoh: panggilan telefon atau WhatsApp). Tutup aplikasi itu dan cuba lagi.";
  return"Rakaman tidak dapat dimulakan"+(n?" ("+n+")":"")+". Muat semula halaman dan cuba lagi."}

const R={strim:null,perakam:null,ketulan:[],mula:0,pemasa:null,main:null,url:null,
  async strimSedia(){if(this.strim&&this.strim.getTracks().some(t=>t.readyState==="live"))return this.strim;this.strim=await navigator.mediaDevices.getUserMedia({audio:true});return this.strim},
  lepas(){try{if(this.perakam&&this.perakam.state!=="inactive")this.perakam.stop()}catch(e){}if(this.strim)this.strim.getTracks().forEach(t=>t.stop());this.strim=null;this.hentiMain()},
  hentiMain(){if(this.main){try{this.main.pause()}catch(e){}this.main=null}if(this.url){URL.revokeObjectURL(this.url);this.url=null}},
  sedang(){return!!(this.perakam&&this.perakam.state==="recording")}
};
async function mulaRakam(){
  const k=klipPapar()[S.idx];const tak=semakSokongan();if(tak){S.ralat=tak;lukis();return}
  R.hentiMain();S.ralat="";
  let st;try{st=await R.strimSedia()}catch(e){S.ralat=mesejRalatMikrofon(e);lukis();return}
  const mime=pilihMime();let pr;try{pr=mime?new MediaRecorder(st,{mimeType:mime}):new MediaRecorder(st)}catch(e){try{pr=new MediaRecorder(st)}catch(e2){S.ralat=mesejRalatMikrofon(e2);lukis();return}}
  R.perakam=pr;R.ketulan=[];R.klip=k;
  pr.ondataavailable=e=>{if(e.data&&e.data.size)R.ketulan.push(e.data)};
  pr.onstop=()=>simpanRakaman(pr,k);
  try{pr.start(250)}catch(e){pr.start()}
  R.mula=Date.now();lukis();
  clearInterval(R.pemasa);R.pemasa=setInterval(()=>{const t=document.getElementById("masaRakam");if(t)t.textContent=((Date.now()-R.mula)/1000).toFixed(0)+" saat";if(Date.now()-R.mula>90000)hentiRakam()},250)}
function hentiRakam(){clearInterval(R.pemasa);if(R.sedang()){try{R.perakam.requestData()}catch(e){}R.perakam.stop()}}
async function simpanRakaman(pr,k){
  const tempoh=Date.now()-R.mula,mime=(pr.mimeType||pilihMime()||(apple?"audio/mp4":"audio/webm")).split(";")[0],blob=new Blob(R.ketulan,{type:mime});R.perakam=null;
  if(blob.size<300||tempoh<500){S.ralat="Rakaman terlalu pendek. Tekan Rakam, baca ayat, kemudian tekan Henti.";lukis();return}
  const data=await blob.arrayBuffer(),ext=extDari(mime);
  const r={kunci:kg()+"/"+k.fail,guru:kg(),fail:k.fail,ext,mime,data,saiz:blob.size,tempohMs:tempoh,masa:new Date().toISOString()};
  const ok=await DB.simpan(r);if(!ok){S.ralat="Rakaman tidak dapat disimpan dalam peranti (ruang penuh?). Muat turun zip dahulu, kemudian cuba lagi.";lukis();return}
  S.ada.set(k.fail,r);S.ralat="";lukis();dengar(k,true)}
function dengar(k,auto){const r=S.ada.get(k.fail);if(!r)return;R.hentiMain();R.url=URL.createObjectURL(new Blob([r.data],{type:r.mime}));const a=new Audio(R.url);R.main=a;
  const b=document.getElementById("bDengar");if(b)b.textContent="⏹ Henti dengar";a.onended=a.onpause=()=>{const x=document.getElementById("bDengar");if(x)x.textContent="▶ Dengar"};
  a.play().catch(()=>{const x=document.getElementById("bDengar");if(x)x.textContent="▶ Dengar";if(!auto){S.ralat="Rakaman tidak dapat dimainkan dalam pelayar ini.";lukis()}})}

const JADUAL_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=JADUAL_CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function binaZip(fail){const en=new TextEncoder(),bah=[],pusat=[];let off=0;
  for(const f of fail){const nm=en.encode(f.nama),u=f.data,crc=crc32(u),sz=u.length,d=f.masa||new Date();
    const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);bah.push(h,nm,u);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(38,0,true);c.setUint32(42,off,true);pusat.push(c,nm);off+=30+nm.length+sz}
  const sp=pusat.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,fail.length,true);e.setUint16(10,fail.length,true);e.setUint32(12,sp,true);e.setUint32(16,off,true);
  return new Blob([...bah,...pusat,e],{type:"application/zip"})}
async function sediakanZip(guru,semula){
  // Mod rakam semula: hanya klip dalam RAKAM_SEMULA, daripada storan "<GURU>-SEMULA", dalam folder <GURU>/rakaman-semula/
  const G=DATA.guru[guru],RS=semula?(RAKAM_SEMULA[guru]||{}):null,senarai=semula?G.senarai.filter(k=>k.fail in RS):G.senarai;
  const L=(await DB.senarai(semula?guru+"-SEMULA":guru)).filter(r=>!semula||r.fail in RS),peta=new Map(L.map(r=>[r.fail,r])),fail=[],baris=[],dir=semula?`${guru}/rakaman-semula`:guru;
  baris.push(`${semula?"Rakaman SEMULA":"Rakaman suara"} ${G.nama} (${guru}) - Pengembaraan Kata Nama`,`Disediakan: ${new Date().toLocaleString("ms-MY")}`,`Siap: ${senarai.filter(k=>peta.has(k.fail)).length} daripada ${senarai.length} klip`,"",
    "No | Nama fail | Keutamaan | Status | Tempoh | Ayat"+(semula?" | Sebab rakam semula":""));
  for(const k of senarai){const r=peta.get(k.fail);
    baris.push(`${k.no} | ${r?k.fail+"."+r.ext:k.fail} | ${k.kp} | ${r?"SIAP":"BELUM"} | ${r?(r.tempohMs/1000).toFixed(1)+" s":"-"} | ${k.teks}`+(semula?` | ${RS[k.fail]}`:""));
    if(r)fail.push({nama:`${dir}/${k.fail}.${r.ext}`,data:new Uint8Array(r.data),masa:new Date(r.masa)})}
  // Rakaman sedia ada bagi klip "tidak digunakan" tidak hilang: dimasukkan dalam folder tidak-digunakan/ (mod biasa sahaja)
  const lebih=semula?[]:(G.tersembunyi||[]).filter(k=>peta.has(k.fail));
  if(lebih.length){baris.push("","Rakaman sedia ada bagi klip TIDAK DIGUNAKAN (lencana/watak checkpoint kini tanpa suara; tidak perlu dirakam):");
    for(const k of lebih){const r=peta.get(k.fail);baris.push(`${k.no} | ${k.fail}.${r.ext} | ${k.kp} | TIDAK DIGUNAKAN | ${(r.tempohMs/1000).toFixed(1)} s | ${k.teks}`);
      fail.push({nama:`${dir}/tidak-digunakan/${k.fail}.${r.ext}`,data:new Uint8Array(r.data),masa:new Date(r.masa)})}}
  fail.push({nama:`${dir}/senarai-rakaman${semula?"-semula":""}.txt`,data:new TextEncoder().encode("﻿"+baris.join("\r\n")+"\r\n"),masa:new Date()});
  return{blob:binaZip(fail),nama:semula?`rakaman-semula-${guru}.zip`:`rakaman-${guru}.zip`,bil:L.length}}
async function muatTurunZip(){const z=await sediakanZip(S.guru,S.semula);
  const a=document.createElement("a"),u=URL.createObjectURL(z.blob);a.href=u;a.download=z.nama;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);
  S.mesej=`Fail ${z.nama} (${z.bil} rakaman, ${(z.blob.size/1048576).toFixed(1)} MB) sedang dimuat turun. Hantar fail ini kepada Cikgu Faris.`;lukis()}
async function kongsiZip(){const z=await sediakanZip(S.guru,S.semula);const f=new File([z.blob],z.nama,{type:"application/zip"});
  try{await navigator.share({files:[f],title:z.nama,text:`Rakaman suara ${DATA.guru[S.guru].nama}`})}catch(e){if(e&&e.name!=="AbortError"){S.ralat="Fail tidak dapat dikongsi. Gunakan butang Muat turun.";lukis()}}}
const bolehKongsi=()=>{try{return!!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.zip",{type:"application/zip"})]}))}catch(e){return false}};

// ---------- Paparan ----------
function lukis(){({guru:lukisGuru,klip:lukisKlip,senarai:lukisSenarai,padam:lukisPadam}[S.skrin])()}
async function lukisGuru(){
  const tak=semakSokongan(),kira={},kiraS={};for(const g of GURU){const F=new Set(DATA.guru[g].senarai.map(k=>k.fail));kira[g]=(await DB.senarai(g)).filter(r=>F.has(r.fail)).length}
  for(const g in RAKAM_SEMULA)kiraS[g]=(await DB.senarai(g+"-SEMULA")).filter(r=>r.fail in RAKAM_SEMULA[g]).length;
  $app.innerHTML=`<h1>🎙️ Alat Rakaman Suara Guru</h1><p>Pengembaraan Kata Nama: Misi Mencari Harta Karun Bahasa</p>
    ${tak?`<p class="ralat">${esc(tak)}</p>`:""}${DB.gagal?`<p class="ralat">Storan peranti tidak tersedia (contoh: mod peribadi). Rakaman akan hilang jika halaman ditutup. Muat turun zip selepas setiap sesi.</p>`:""}
    <div class="kad"><h2 style="margin-top:0">Pilih nama anda</h2><p class="kecil">Hanya dialog anda akan dipaparkan. Rakaman setiap guru disimpan berasingan dalam peranti ini.</p>
    ${GURU.map(g=>{const G=DATA.guru[g];return`<button class="guru-btn" data-g="${g}"><span>${esc(G.nama)}</span><small>${kira[g]}/${G.senarai.length} siap</small></button>`}).join("")}</div>
    <div class="kad"><h2 style="margin-top:0">🔁 Rakam semula sahaja</h2><p class="kecil">Hanya klip yang perlu dirakam semula dipaparkan. Rakaman lama dalam peranti ini <b>tidak dipadam</b>. Zip: rakaman-semula-NAMA.zip.</p>
    ${Object.keys(RAKAM_SEMULA).map(g=>{const G=DATA.guru[g],n=Object.keys(RAKAM_SEMULA[g]).length;return`<button class="guru-btn" data-gs="${g}"><span>${esc(G.nama)}</span><small>${kiraS[g]}/${n} siap</small></button>`}).join("")}</div>
    <p class="kecil">Rakaman kekal dalam peranti ini walaupun halaman ditutup, jadi anda boleh menyambung kemudian. Muat turun zip dan hantar kepada Cikgu Faris apabila siap.</p>`;
  $app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>pilihGuru(b.dataset.g,false));
  $app.querySelectorAll("[data-gs]").forEach(b=>b.onclick=()=>pilihGuru(b.dataset.gs,true))}
async function pilihGuru(g,semula){S.guru=g;S.semula=!!semula;S.k1=bacaLS("pkn-rg-k1-"+g,false);S.idx=0;await muatAda();
  const akhir=bacaLS("pkn-rg-posisi-"+kg(),null),L=klipPapar(),i=akhir?L.findIndex(k=>k.fail===akhir):-1;
  S.idx=i>=0?i:Math.max(0,L.findIndex(k=>!S.ada.has(k.fail)));S.skrin="klip";S.ralat="";S.mesej="";lukis();window.scrollTo(0,0)}
function kepala(){const G=DATA.guru[S.guru],jum=G.senarai.length,siap=G.senarai.filter(k=>S.ada.has(k.fail)).length,k1=G.senarai.filter(k=>k.kp===1),k1s=k1.filter(k=>S.ada.has(k.fail)).length;
  if(S.semula){const L=klipPapar(),s=L.filter(k=>S.ada.has(k.fail)).length;
    return`<div class="atas"><button id="bTukar" aria-label="Tukar guru">◀ Guru</button><span class="nama">🔁 ${esc(G.nama)}</span><button id="bSenarai">☰ Senarai</button></div>
    <div class="trek" aria-hidden="true"><i style="width:${L.length?s/L.length*100:0}%"></i></div>
    <div class="baris-kemajuan"><span class="meta"><b>Rakam semula: ${s}/${L.length} siap</b></span></div>`}
  return`<div class="atas"><button id="bTukar" aria-label="Tukar guru">◀ Guru</button><span class="nama">${esc(G.nama)}</span><button id="bSenarai">☰ Senarai</button></div>
    <div class="trek" aria-hidden="true"><i style="width:${jum?siap/jum*100:0}%"></i></div>
    <div class="baris-kemajuan"><span class="meta"><b>${siap}/${jum} siap</b> · K1: ${k1s}/${k1.length}</span><label class="suis"><input type="checkbox" id="cK1" ${S.k1?"checked":""}> Keutamaan 1 sahaja</label></div>`}
function pasangKepala(){document.getElementById("bTukar").onclick=()=>{if(R.sedang())return;R.lepas();S.skrin="guru";S.guru=null;S.semula=false;lukis()};
  document.getElementById("bSenarai").onclick=()=>{if(R.sedang())return;R.hentiMain();S.skrin="senarai";lukis();window.scrollTo(0,0)};
  const cK1=document.getElementById("cK1");if(cK1)cK1.onchange=e=>{if(R.sedang()){e.target.checked=S.k1;return}const kini=klipPapar()[S.idx];S.k1=e.target.checked;simpanLS("pkn-rg-k1-"+S.guru,S.k1);
    const L=klipPapar(),i=kini?L.findIndex(k=>k.fail===kini.fail):-1;S.idx=i>=0?i:Math.max(0,L.findIndex(k=>!S.ada.has(k.fail)));lukis()}}
function lukisKlip(){
  const L=klipPapar();if(S.idx>=L.length)S.idx=L.length-1;const k=L[S.idx],r=S.ada.get(k.fail),rek=R.sedang();simpanLS("pkn-rg-posisi-"+kg(),k.fail);
  const ext=r?r.ext:extJangka();
  // Susunan padat supaya butang Rakam kelihatan tanpa menatal pada telefon kecil: maklumat ringkas, nada, ayat, status, butang; nama fail di bawah
  $app.innerHTML=kepala()+`<div class="kad">
    <div class="meta"><span class="lencana k${k.kp}">K${k.kp}</span>Klip <b>${S.idx+1}</b>/${L.length} · No. ${k.no} · ${esc(k.lok)}${k.watak!==DATA.guru[S.guru].nama?` · <b>Watak: ${esc(k.watak)}</b>`:""}</div>
    <div class="nada">🎭 ${esc(k.nada)}${k.cat?`. ${esc(k.cat)}`:""}</div>
    ${S.semula?`<div class="nada" style="border-left-color:var(--merah);margin-top:6px">🔁 Sebab rakam semula: ${esc((RAKAM_SEMULA[S.guru]||{})[k.fail]||"")}</div>`:""}
    <div class="ayat${k.teks.length>120?" panjang":""}">${esc(k.teks)}</div>
    <div class="status ${rek?"rekod":r?"ok":""}">${rek?`<span class="titik"></span>Sedang merakam… <span id="masaRakam">0 saat</span>`:r?`✓ Sudah dirakam (${(r.tempohMs/1000).toFixed(1)} saat)`:"Belum dirakam"}</div>
    ${S.ralat?`<p class="ralat" role="alert">${esc(S.ralat)}</p>`:""}
    <div class="kawalan">${rek?`<button class="rakam penuh" id="bHenti">⏹ Henti</button>`:r?`<button id="bDengar">▶ Dengar</button><button id="bSemula">🔁 Rakam semula</button>`:`<button class="rakam penuh" id="bRakam">🎙️ Rakam</button>`}</div>
    <div class="navi"><button id="bSebelum" ${S.idx===0||rek?"disabled":""}>◀ Sebelum</button><button class="${r?"utama":""}" id="bSeterus" ${S.idx>=L.length-1||rek?"disabled":""}>Seterusnya ▶</button></div>
    <p class="kecil" style="margin:10px 0 0">Nama fail (automatik): <span class="fail">${esc(k.fail)}.${ext}</span></p></div>
    <div class="bawah"><button class="hijau" id="bZip" ${rek?"disabled":""}>${S.semula?"⬇ Muat turun rakaman semula (zip)":"⬇ Muat turun semua (zip)"}</button>${bolehKongsi()?`<button id="bKongsi" ${rek?"disabled":""}>📤 Kongsi zip (WhatsApp / e-mel)</button>`:""}</div>
    ${S.mesej?`<p class="kecil">${esc(S.mesej)}</p>`:""}`;
  pasangKepala();const on=(id,f)=>{const b=document.getElementById(id);if(b)b.onclick=f};
  on("bRakam",mulaRakam);on("bSemula",mulaRakam);on("bHenti",hentiRakam);
  on("bDengar",()=>{if(R.main&&!R.main.paused){R.hentiMain();document.getElementById("bDengar").textContent="▶ Dengar"}else dengar(k)});
  on("bSebelum",()=>{R.hentiMain();S.idx--;S.ralat="";S.mesej="";lukis()});on("bSeterus",()=>{R.hentiMain();S.idx++;S.ralat="";S.mesej="";lukis()});
  on("bZip",muatTurunZip);on("bKongsi",kongsiZip)}
function lukisSenarai(){
  const L=klipPapar();
  $app.innerHTML=kepala()+`<div class="kad"><h2 style="margin-top:0">Senarai klip</h2><p class="kecil">Ketik klip untuk merakam atau mendengar semula. ✓ = siap.</p>
    <ul class="senarai">${L.map((k,i)=>{const r=S.ada.get(k.fail);return`<li><button data-i="${i}"><b class="${r?"siap":""}">${r?"✓":"○"}</b><span>${k.no}. ${esc(k.teks.length>70?k.teks.slice(0,67)+"…":k.teks)}<small>${esc(k.fail)}${r?"."+r.ext:""} · K${k.kp}</small></span></button></li>`}).join("")}</ul>
    <div class="navi"><button id="bKembali">◀ Kembali</button><button class="hijau" id="bZip">⬇ Muat turun zip</button></div></div>
    <p><button class="bahaya" id="bPadam" style="width:100%">🗑 Padam semua rakaman ${S.semula?"semula ":""}${esc(DATA.guru[S.guru].nama)} dalam peranti ini</button></p>${S.mesej?`<p class="kecil">${esc(S.mesej)}</p>`:""}`;
  pasangKepala();$app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.idx=+b.dataset.i;S.skrin="klip";S.ralat="";lukis();window.scrollTo(0,0)});
  document.getElementById("bKembali").onclick=()=>{S.skrin="klip";lukis()};document.getElementById("bZip").onclick=muatTurunZip;document.getElementById("bPadam").onclick=()=>{S.skrin="padam";lukis()}}
function lukisPadam(){const G=DATA.guru[S.guru];
  $app.innerHTML=`<div class="kad"><h2 style="margin-top:0">🗑 Padam rakaman ${S.semula?"semula ":""}${esc(G.nama)}</h2><p>Semua <b>${S.ada.size}</b> rakaman ${S.semula?"semula ":""}${esc(G.nama)} dalam peranti ini akan dipadam.${S.semula?" Rakaman asal (mod biasa) tidak terjejas.":""} Rakaman guru lain tidak terjejas. Tindakan ini tidak boleh diundur. Pastikan zip sudah dihantar kepada Cikgu Faris.</p>
    <label>Taip <b>PADAM</b> untuk mengesahkan<input type="text" id="iPadam" autocomplete="off" autocapitalize="characters"></label>${S.ralat?`<p class="ralat">${esc(S.ralat)}</p>`:""}
    <div class="navi"><button id="bBatal">Batal</button><button class="rakam" id="bYa">Padam</button></div></div>`;
  document.getElementById("bBatal").onclick=()=>{S.ralat="";S.skrin="senarai";lukis()};
  document.getElementById("bYa").onclick=async()=>{if(document.getElementById("iPadam").value.trim().toUpperCase()!=="PADAM"){S.ralat="Taip PADAM untuk mengesahkan.";lukis();return}
    const n=await DB.padamGuru(kg());await muatAda();S.ralat="";S.mesej=`${n} rakaman dipadam.`;S.skrin="senarai";lukis()}}

// Jika halaman disembunyikan semasa merakam (contoh: panggilan masuk), rakaman dihentikan dan disimpan
document.addEventListener("visibilitychange",()=>{if(document.hidden&&R.sedang())hentiRakam()});
window.addEventListener("pagehide",()=>R.lepas());
(async()=>{await DB.buka();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}lukis()})();
</script>
